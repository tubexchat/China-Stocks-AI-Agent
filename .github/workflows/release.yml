name: Release · AShareAgent.dmg

# 每次推 main:测试 → Release 构建 → 打 DMG(有证书就正式签名+公证,没有就 ad-hoc)
# → 发布到本仓库的 GitHub Release(tag v<版本>-<构建号>,附 DMG / ZIP / latest.json)
# → 同步到 api-dev.pipai.org(app.pipai.org 的下载按钮读 GET /v1/releases/latest,立刻拿到新版本)→ Lark 通知
on:
  push:
    branches: [main]
    paths-ignore:          # 只改文档不打包
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch: {}

permissions:
  contents: write   # 创建 GitHub Release;失败时把日志推到 ci-logs 分支

concurrency:
  group: release-ashareagent-mac
  cancel-in-progress: false

env:
  # Lark 群机器人(若配置了 secrets.LARK_WEBHOOK 则优先用它)
  LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK || 'https://open.larksuite.com/open-apis/bot/v2/hook/81aea633-3d3d-46ee-97cb-af24a9560865' }}

jobs:
  build:
    name: Test · Build · Package
    runs-on: macos-15
    outputs:
      dmg: ${{ steps.pkg.outputs.dmg }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode & install XcodeGen
        run: |
          set -eux
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          brew install xcodegen >/dev/null 2>&1 || brew upgrade xcodegen >/dev/null 2>&1 || true
          xcodegen --version

      - name: Test
        id: test
        run: |
          set -o pipefail
          xcodegen generate >/dev/null
          xcodebuild test -project Axblade.xcodeproj -scheme Axblade \
            -destination 'platform=macOS,arch=arm64' 2>&1 | tee build-test.log \
            | grep -E "error:|Test Suite .* (passed|failed)|Executed [0-9]+ tests|\*\* TEST (SUCCEEDED|FAILED) \*\*|BUILD FAILED" | tail -20

      # ---- 可选:正式签名 / 公证(仓库或组织 secrets 存在时自动启用)----
      #   MAC_SIGNING_P12_BASE64 / MAC_SIGNING_P12_PASSWORD  → "Developer ID Application" 证书(.p12,base64)
      #   NOTARY_KEY_P8_BASE64 / NOTARY_KEY_ID / NOTARY_ISSUER_ID → App Store Connect API Key,公证用
      #   或 NOTARY_APPLE_ID / NOTARY_PASSWORD(App 专用密码)/ NOTARY_TEAM_ID → 同样可公证
      - name: Import Developer ID certificate (optional)
        id: cert
        env:
          P12_B64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -eu
          if [ -z "${P12_B64:-}" ]; then echo "identity=-" >> "$GITHUB_OUTPUT"; echo "no signing secrets → ad-hoc"; exit 0; fi
          KC=$RUNNER_TEMP/signing.keychain-db; KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${P12_PASS:-}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$ID" ] || { echo "::error::p12 里没有 Developer ID Application 证书"; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"; echo "signing as: $ID"

      - name: Package DMG
        id: pkg
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARY_B64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail   # pipefail:package-dmg.sh(如公证失败)出错时本步骤必须失败,而不是被 tee/tail 吞掉
          ARGS=(--build "$GITHUB_RUN_NUMBER" --identity "$IDENTITY")
          if [ -n "${NOTARY_B64:-}" ] && [ "$IDENTITY" != "-" ]; then
            # ---- 公证凭据自检:去掉粘贴带入的空白;secret 既可以是 p8 的 base64,也可以直接是 p8 原文 ----
            NOTARY_KEY_ID=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')
            NOTARY_ISSUER=$(printf '%s' "$NOTARY_ISSUER" | tr -d '[:space:]')
            P8="$RUNNER_TEMP/notary.p8"
            if printf '%s' "$NOTARY_B64" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$NOTARY_B64" > "$P8"; echo "notary: secret 是 p8 原文(非 base64),直接使用"
            else
              printf '%s' "$NOTARY_B64" | tr -d '[:space:]' | base64 --decode > "$P8" || { echo "::error::NOTARY_KEY_P8_BASE64 不是合法 base64"; exit 1; }
            fi
            grep -q "BEGIN PRIVATE KEY" "$P8" || { echo "::error::解码后的内容不是 p8 私钥(应以 -----BEGIN PRIVATE KEY----- 开头)"; exit 1; }
            h() { printf '%s' "$1" | shasum -a 256 | cut -c1-12; }
            echo "notary: p8 sha256=$(shasum -a 256 "$P8" | cut -c1-12)… key-id 长度=${#NOTARY_KEY_ID}(应为 10) sha256=$(h "$NOTARY_KEY_ID")… issuer 长度=${#NOTARY_ISSUER}(应为 36) sha256=$(h "$NOTARY_ISSUER")…" | tee build-notary.log
            xcrun notarytool history --key "$P8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" >/dev/null 2>"$RUNNER_TEMP/notary-check.log" \
              || { cat "$RUNNER_TEMP/notary-check.log" | tee -a build-notary.log; echo "::error::公证凭据认证失败:请核对 NOTARY_KEY_P8_BASE64 / NOTARY_KEY_ID / NOTARY_ISSUER_ID 三者是否同一把 App Store Connect API key"; exit 1; }
            echo "notary: 凭据认证通过" | tee -a build-notary.log
            ARGS+=(--notary-key "$P8" --notary-key-id "$NOTARY_KEY_ID" --notary-issuer "$NOTARY_ISSUER")
          elif [ -n "${NOTARY_APPLE_ID:-}" ] && [ -n "${NOTARY_PASSWORD:-}" ] && [ "$IDENTITY" != "-" ]; then
            ARGS+=(--notary-apple-id "$NOTARY_APPLE_ID" --notary-password "$NOTARY_PASSWORD" --notary-team-id "${NOTARY_TEAM_ID:-A2SZ953D3V}")
          fi
          ./scripts/package-dmg.sh "${ARGS[@]}" 2>&1 | tee build-package.log | tail -15
          [ -f build/dmg/latest.json ] || { echo "::error::package-dmg.sh 未生成 build/dmg/latest.json(见上方日志,常见原因:公证凭据错误)"; exit 1; }
          echo "dmg=$(python3 -c 'import json;print(json.load(open("build/dmg/latest.json"))["file"])')" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (record)
        uses: actions/upload-artifact@v4
        with:
          name: AShareAgent-dmg-${{ github.run_number }}
          path: |
            build/dmg/*.dmg
            build/dmg/*.zip
            build/dmg/latest.json
          retention-days: 30

      # ---- 发布到本仓库的 GitHub Release:tag v<版本>-<构建号>,附件 DMG / ZIP / latest.json ----
      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -eu
          meta=build/dmg/latest.json
          ver=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["version"])')
          file=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["file"])')
          tag="v${ver}-${GITHUB_RUN_NUMBER}"
          signed=$([ "$IDENTITY" != "-" ] && echo "Developer ID 签名" || echo "ad-hoc 签名(未公证,首次需右键 → 打开)")
          notes="A股智能体 (AShareAgent) for Mac v${ver},构建 #${GITHUB_RUN_NUMBER}。${signed}。仅支持 Apple Silicon,macOS 14+。提交 ${GITHUB_SHA:0:7}。"
          # GitHub API 偶发 5xx / 网络抖动会让 create 失败:最多重试 3 次;若 release 已存在(上次创建成功但上传中断)则改为补传附件
          assets=(build/dmg/*.dmg build/dmg/*.zip build/dmg/latest.json)
          ok=0
          for attempt in 1 2 3; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $tag 已存在,补传附件(attempt $attempt)"
              gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber && ok=1 && break
            else
              gh release create "$tag" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AShareAgent v${ver} (#${GITHUB_RUN_NUMBER})" --notes "$notes" --latest \
                && ok=1 && break
              echo "::warning::gh release create 失败(attempt $attempt),15s 后重试"
            fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::发布 GitHub Release 失败(重试 3 次)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          echo "download=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/${file}" >> "$GITHUB_OUTPUT"

      # ---- 同步到 api-dev.pipai.org:DMG / ZIP / latest.json scp 到服务器 RELEASES_DIR(默认 /home/ubuntu/releases),
      #      后端 GET /v1/releases/latest 读到即生效,app.pipai.org 的「Download for Mac」直链走自有服务器(国内快)。
      #      需要 secrets:SERVER_HOST / SERVER_USERNAME / SERVER_SSH_KEY(与后端仓库同名,建议设为组织级 secrets);
      #      缺任一则跳过,落地页自动回退到 GitHub Release 附件直链。----
      - name: Sync to api-dev.pipai.org
        id: sync
        if: steps.release.outcome == 'success'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          DIR: ${{ vars.RELEASES_DIR || '/home/ubuntu/releases' }}
          KEEP: ${{ vars.RELEASES_KEEP || 5 }}
          API: https://api-dev.pipai.org
        run: |
          set -eu
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${KEY:-}" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 SERVER_HOST / SERVER_USERNAME / SERVER_SSH_KEY,跳过同步;落地页回退到 GitHub 直链"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key && chmod 600 ~/.ssh/release_key
          SSH_OPTS="-i $HOME/.ssh/release_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          meta=build/dmg/latest.json
          ver=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["version"])')
          file=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["file"])')
          zip=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["zip_file"])')
          tmp="$DIR/.incoming-$GITHUB_RUN_NUMBER"

          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p '$DIR' '$tmp'"
          scp $SSH_OPTS "build/dmg/$file" "build/dmg/$zip" "$meta" "$USER@$HOST:$tmp/"
          # 先落 DMG/ZIP 再换 latest.json,接口任何时刻读到的都是完整版本;最后只保留最近 KEEP 个版本
          ssh $SSH_OPTS "$USER@$HOST" "set -e; cd '$DIR'
            mv -f '$tmp/$file' '$tmp/$zip' .
            cp -f '$file' AShareAgent-latest.dmg && cp -f '$zip' AShareAgent-latest.zip
            mv -f '$tmp/latest.json' latest.json && rmdir '$tmp'
            ls -t AShareAgent-*-*.dmg | tail -n +$((KEEP+1)) | xargs -r rm -f
            ls -t AShareAgent-*-*.zip | tail -n +$((KEEP+1)) | xargs -r rm -f
            ls -la"
          echo "download=$API/releases/$file" >> "$GITHUB_OUTPUT"

          # 线上验证:/v1/releases/latest 必须已经返回本次构建(后端未部署 releases 接口时给出警告,不算失败)
          got=$(curl -sS --max-time 20 "$API/v1/releases/latest" \
            | python3 -c 'import json,sys
          try:
              d=json.load(sys.stdin); print(d.get("version"),d.get("build"),d.get("source"),d.get("download_url"))
          except Exception as e: print("unparsable",e)' || true)
          echo "api → $got"
          case "$got" in
            "$ver $GITHUB_RUN_NUMBER server "*) echo "status=synced" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::文件已上传,但 $API/v1/releases/latest 尚未返回本次构建(后端 releases 接口未部署?)"
               echo "status=uploaded-unverified" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Lark 通知
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          O_TEST: ${{ steps.test.outcome }}
          O_PKG: ${{ steps.pkg.outcome }}
          O_RELEASE: ${{ steps.release.outcome }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download }}
          SYNC_STATUS: ${{ steps.sync.outputs.status }}
          SYNC_DOWNLOAD: ${{ steps.sync.outputs.download }}
          O_SYNC: ${{ steps.sync.outcome }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          set -u
          short=${GITHUB_SHA:0:7}
          subject=$(printf '%s' "$COMMIT_MSG" | head -1 | cut -c1-80)
          meta=build/dmg/latest.json
          if [ -f "$meta" ]; then
            ver=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["version"])')
            file=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["file"])')
            size=$(python3 -c 'import json;print(round(json.load(open("'"$meta"'"))["size"]/1048576,1))')
            sha=$(python3 -c 'import json;print(json.load(open("'"$meta"'"))["sha256"][:12])')
            signed=$([ "$IDENTITY" != "-" ] && echo "Developer ID" || echo "ad-hoc(未签名,首次右键打开)")
          else
            ver="?"; file="?"; size="?"; sha="?"; signed="?"
          fi
          case "${SYNC_STATUS:-}" in
            synced)              site="已同步,app.pipai.org 可直接下载(${SYNC_DOWNLOAD})" ;;
            uploaded-unverified) site="已上传服务器,但 /v1/releases/latest 尚未返回本版(检查后端部署)" ;;
            skipped)             site="未同步(缺 SERVER_* secrets),落地页走 GitHub 直链" ;;
            *)                   site="同步失败(sync=${O_SYNC}),落地页仍是上一版" ;;
          esac
          if [ "$O_RELEASE" = "success" ]; then
            STATUS=success
            [ "${SYNC_STATUS:-}" = "synced" ] || STATUS=warning
            BODY="**应用**:A股智能体 (AShareAgent) for Mac\n**版本**:v${ver}(构建 #${GITHUB_RUN_NUMBER})· ${size} MB · ${signed}\n**文件**:${file}(sha256 ${sha}…)\n**官网**:${site}\n**提交**:${short} ${subject}\n**推送者**:${ACTOR}"
            BUTTONS="官网下载|https://app.pipai.org;下载 DMG|${SYNC_DOWNLOAD:-$DOWNLOAD_URL};GitHub Release|${RELEASE_URL};Actions|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            STATUS=failure
            stage="测试"; [ "$O_TEST" = "success" ] && stage="打包"; [ "$O_PKG" = "success" ] && stage="发布 GitHub Release"
            hint=""; [ "$O_PKG" = "success" ] && [ "$O_RELEASE" != "success" ] && hint="\n**提示**:DMG 已打好(见 Actions artifact);Release 创建失败请看 Actions 日志"
            BODY="**应用**:A股智能体 (AShareAgent) for Mac\n**失败阶段**:${stage}(test=${O_TEST}, pkg=${O_PKG}, release=${O_RELEASE})\n**版本**:v${ver}(构建 #${GITHUB_RUN_NUMBER})\n**提交**:${short} ${subject}\n**推送者**:${ACTOR}\n**日志**:仓库 ci-logs 分支(git fetch origin ci-logs)${hint}"
            BUTTONS="Actions|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          export STATUS TITLE="AShareAgent Mac 打包发布" BODY BUTTONS
          ./.github/scripts/notify-lark.sh

      - name: Publish logs to ci-logs branch (on failure)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /tmp/ci-logs
          for f in build-test.log build-package.log build-notary.log; do [ -f "$f" ] && cp "$f" "/tmp/ci-logs/${f%.log}-${GITHUB_RUN_NUMBER}.log" || true; done
          { xcodebuild -version; sw_vers; } > "/tmp/ci-logs/env-${GITHUB_RUN_NUMBER}.txt" 2>&1 || true
          {
            echo "steps: cert=${{ steps.cert.outcome }} pkg=${{ steps.pkg.outcome }} release=${{ steps.release.outcome }} sync=${{ steps.sync.outcome }}"
          } > "/tmp/ci-logs/steps-${GITHUB_RUN_NUMBER}.txt"
          cd /tmp/ci-logs && git init -q -b ci-logs && git config user.email ci@users.noreply.github.com && git config user.name ci-logs
          git add -A && git commit -q -m "release logs run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs:ci-logs
